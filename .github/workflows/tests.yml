name: tests

on:
  push:
  pull_request:

jobs:
  fel1-lng-cost:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fel1-lng-cost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
